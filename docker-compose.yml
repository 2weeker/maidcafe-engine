services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maidcafe}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maidcafe}
      POSTGRES_DB: ${POSTGRES_DB:-maidcafe}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./config.yaml:/etc/maidcafe/config.yaml:ro
    environment:
      CONFIG_PATH: /etc/maidcafe/config.yaml
      LISTEN_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-maidcafe}:${POSTGRES_PASSWORD:-maidcafe}@db:5432/${POSTGRES_DB:-maidcafe}?sslmode=disable
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pgdata:
